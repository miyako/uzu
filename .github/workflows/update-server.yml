name: Update server

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: trymirai/uzu tag or commit containing the cli and cli-tools Cargo packages
        type: string
        required: true
        default: '0.6.13'
      mode:
        description: Component semantic version increment
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true
      use_self_hosted:
        description: Use the self-hosted runner for the subsequent component publish
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-server
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: trymirai/uzu
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Record source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build prerequisites
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          xcodebuild -downloadComponent MetalToolchain
          # Honor the toolchain selected by the upstream checkout.
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal executables
        run: |
          cargo build --locked --release --package cli --package cli-tools --target aarch64-apple-darwin
          cargo build --locked --release --package cli --package cli-tools --target x86_64-apple-darwin
          mkdir -p dist
          for executable in cli cli-tools; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$executable" \
              "target/x86_64-apple-darwin/release/$executable" \
              -output "dist/$executable"
            lipo -verify_arch arm64 x86_64 "dist/$executable"
            chmod +x "dist/$executable"
          done
          dist/cli --version
          dist/cli server --help
          dist/cli-tools --help

      - name: Upload unsigned executables
        uses: actions/upload-artifact@v4
        with:
          name: server-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 1

  update:
    needs: build
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout component
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          name: server-unsigned
          path: uzu/Resources/bin/macOS

      - name: Setup signing keychain
        id: keychain
        uses: miyako/4D/.github/actions/deployment-setup-keychain@v1
        with:
          APPLE_DEVELOPER_ID_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Sign and verify executables
        env:
          SIGNING_IDENTITY: ${{ secrets.CODESIGN_APPLE_ID }}
          SIGNING_KEYCHAIN: ${{ steps.keychain.outputs.KEYCHAIN_PATH }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: |
          for executable in cli cli-tools; do
            binary="uzu/Resources/bin/macOS/$executable"
            chmod +x "$binary"
            lipo -verify_arch arm64 x86_64 "$binary"
            codesign --force --options runtime --timestamp \
              --sign "$SIGNING_IDENTITY" --keychain "$SIGNING_KEYCHAIN" "$binary"
            codesign --verify --strict --all-architectures --verbose=2 "$binary"
            codesign --display --verbose=4 "$binary" 2>&1 | grep -Fx "TeamIdentifier=$TEAM_ID"
          done
          uzu/Resources/bin/macOS/cli --version
          uzu/Resources/bin/macOS/cli server --help
          uzu/Resources/bin/macOS/cli-tools --help

      - name: Package signed server
        env:
          SIGNING_IDENTITY: ${{ secrets.CODESIGN_APPLE_ID }}
          SIGNING_KEYCHAIN: ${{ steps.keychain.outputs.KEYCHAIN_PATH }}
        run: |
          hdiutil create -format UDZO \
            -srcfolder uzu/Resources/bin/macOS "$RUNNER_TEMP/uzu-server.dmg"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" \
            --keychain "$SIGNING_KEYCHAIN" "$RUNNER_TEMP/uzu-server.dmg"
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/uzu-server.dmg"

      - name: Notarize server
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          result="$RUNNER_TEMP/server-notarization.json"
          xcrun notarytool submit "$RUNNER_TEMP/uzu-server.dmg" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD" \
            --wait --timeout 30m --output-format json > "$result"
          cat "$result"
          if ! jq -e '.status == "Accepted"' "$result"; then
            submission_id=$(jq -er '.id' "$result")
            xcrun notarytool log "$submission_id" \
              --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_PASSWORD"
            exit 1
          fi
          xcrun stapler staple "$RUNNER_TEMP/uzu-server.dmg"
          xcrun stapler validate "$RUNNER_TEMP/uzu-server.dmg"
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$RUNNER_TEMP/uzu-server.dmg"

      - name: Upload notarized server
        uses: actions/upload-artifact@v4
        with:
          name: server-notarized
          path: ${{ runner.temp }}/uzu-server.dmg
          if-no-files-found: error

      - name: Commit server update
        env:
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uzu/Resources/bin/macOS/cli uzu/Resources/bin/macOS/cli-tools
          git commit -m "Update uzu server from trymirai/uzu@$SOURCE_SHA" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Remove signing credentials
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ steps.keychain.outputs.KEYCHAIN_PATH }}
          SIGNING_CERTIFICATE: ${{ steps.keychain.outputs.CERTIFICATE_PATH }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          if [ -n "$SIGNING_CERTIFICATE" ] && [ -f "$SIGNING_CERTIFICATE" ]; then
            rm "$SIGNING_CERTIFICATE"
          fi

  publish:
    needs: update
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      mode: ${{ inputs.mode }}
      use_self_hosted: ${{ inputs.use_self_hosted }}
    secrets: inherit
