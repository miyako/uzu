name: Validate integration

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - scripts/**
      - tests/**
      - site/**
      - uzu/Project/Sources/**
      - uzu/Documentation/**
      - .github/workflows/**
      - README.md
      - docs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release helpers, integration contracts and site links
        run: python3 -m unittest discover -s tests -v
      - name: Check shell syntax and whitespace
        run: |
          bash -n scripts/build-native.sh scripts/smoke-native.sh
          git diff --check
      - name: Validate workflow schemas and expressions
        uses: docker://rhysd/actionlint:1.7.11
